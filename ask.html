<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a0611" />
  <title>M ♡ E</title>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 22%, #651029 0%, rgba(92, 12, 34, .58) 22%, transparent 52%),
        radial-gradient(circle at 12% 82%, rgba(126, 24, 72, .56), transparent 28%),
        radial-gradient(circle at 91% 75%, rgba(195, 44, 84, .25), transparent 22%),
        linear-gradient(145deg, #15040d 0%, #310818 46%, #10030b 100%);
      color: #ffe8ed;
      font-family: Arial, sans-serif;
      isolation: isolate;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      z-index: -1;
      width: min(55vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(42px);
      opacity: .52;
      pointer-events: none;
      animation: drift 9s ease-in-out infinite alternate;
    }

    body::before { top: -24%; left: -13%; background: #8f1c52; }
    body::after { right: -14%; bottom: -26%; background: #c82c61; animation-delay: -4.5s; }

    .artwork {
      position: relative;
      width: min(94vw, 800px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .artwork::before {
      content: '';
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 129, 162, .2), transparent 67%);
      filter: blur(18px);
      pointer-events: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .start-heart {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      width: clamp(128px, 20vw, 158px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 27%, #ff9fbc 0%, #c7265c 50%, #851137 100%);
      box-shadow: 0 0 22px rgba(255, 111, 153, .28), inset 0 1px rgba(255, 255, 255, .5);
      color: #fff;
      cursor: pointer;
      font-family: 'Segoe UI', 'Aptos', Arial, sans-serif;
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .025em;
      text-align: center;
      text-shadow: 0 2px 5px rgba(72, 0, 22, .7);
      transform: translate(-50%, -50%);
      transition: filter .2s ease;
    }

    .start-heart::before {
      content: '';
      position: absolute;
      inset: -14px;
      border: 2px dashed rgba(255, 225, 233, .88);
      border-radius: 50%;
      animation: dashed-orbit 14s linear infinite;
    }

    .start-heart::after {
      content: '';
      position: absolute;
      top: 23px;
      left: 50%;
      color: #fff7fa;
      font: 400 2rem/1 Georgia, serif;
      transform: translateX(-50%);
    }

    .start-heart:hover { filter: brightness(1.12); }
    .start-heart:focus-visible { outline: 3px solid #fff; outline-offset: 7px; }
    .start-heart span { margin-top: .5rem; }
    .start-heart.leaving { pointer-events: none; animation: start-disappear .62s cubic-bezier(.35, .8, .25, 1) forwards; }

    .artwork:not(.started) .message-card,
    .artwork:not(.started) .restart { visibility: hidden; opacity: 0; }

    .restart {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      appearance: none;
      border: 1px solid rgba(255, 201, 211, .24);
      border-radius: 999px;
      padding: .6rem .9rem;
      background: rgba(35, 3, 12, .7);
      color: rgba(255, 232, 237, .85);
      font: 700 .78rem/1 Arial, sans-serif;
      letter-spacing: .02em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .35s ease, transform .35s ease, background .2s ease;
    }

    .artwork.complete .restart {
      opacity: 1;
      transform: translateY(0);
    }

    .restart:hover { background: rgba(94, 7, 27, .88); }
    .restart:focus-visible { outline: 2px solid #ffced8; outline-offset: 3px; }

    .message-card {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 51%;
      margin: 0;
      width: min(58%, 380px);
      display: grid;
      place-items: center;
      padding: 0;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .love-message {
      color: #fff;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Segoe UI', 'Aptos', Arial, sans-serif;
      font-size: clamp(1.15rem, 2.75vw, 1.75rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: .015em;
      text-shadow: 0 3px 11px rgba(54, 0, 18, .98), 0 0 19px rgba(255, 171, 197, .25);
    }

    .love-phrase { white-space: nowrap; }

    .love-name {
      margin-top: .08em;
      color: #fff;
      font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
      font-size: 1.38em;
      font-weight: 700;
      letter-spacing: .035em;
      line-height: 1;
    }

    .love-message.show { animation: message-reveal 1s cubic-bezier(.2, .82, .22, 1) both; }

    @keyframes message-reveal {
      0% { opacity: 0; filter: blur(4px); }
      100% { opacity: 1; filter: blur(0); }
    }

    @keyframes drift {
      to { transform: translate(10vw, 7vh) scale(1.13); }
    }

    @keyframes dashed-orbit { to { transform: rotate(360deg); } }

    @keyframes start-disappear {
      to { opacity: 0; transform: translate(-50%, -50%) scale(.58) rotate(16deg); filter: blur(4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .restart, .message-card, .start-heart, .start-heart::before, body::before, body::after { transition: none; animation: none; }
      .love-message.show { animation: none; }
    }
  </style>
</head>
<body>
  <main class="artwork" aria-label="Farklı dillerde sevgi sözcükleriyle oluşan animasyonlu kalp">
    <canvas id="heart" aria-hidden="true"></canvas>
    <button class="start-heart" id="start-heart" type="button" aria-label="Kalp animasyonunu başlat"><span>Buraya Tıkla<br>Aşkım</span></button>
    <section class="message-card" aria-label="Mensure için sevgi mesajı">
      <span class="love-message" id="love-message">Seni seviyorum Mensure</span>
    </section>
    <button class="restart" id="restart" type="button">↻ Yeniden oynat</button>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.querySelector('#heart');
      const context = canvas.getContext('2d');
      const artwork = document.querySelector('.artwork');
      const startHeartButton = document.querySelector('#start-heart');
      const restartButton = document.querySelector('#restart');
      const loveMessage = document.querySelector('#love-message');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      const PHRASES = [
        'I love you', 'Seni seviyorum', 'Te amo', "Je t'aime",
        'Ich liebe dich', 'Ti amo', 'Eu te amo', 'Я тебя люблю',
        '사랑해', '愛してる', '我爱你', 'मैं तुमसे प्यार करता हूँ',
        "Σ' αγαπώ", 'Ik hou van jou', 'Jag älskar dig', 'Kocham cię',
        'ฉันรักเธอ', 'Anh yêu em', 'Aku cinta kamu', 'Я тебе кохаю'
      ];
      const LOVE_MESSAGES = [
        '🇬🇧 I love you Mensure', '🇹🇷 Seni seviyorum Mensure', '🇪🇸 Te amo Mensure', "🇫🇷 Je t'aime Mensure",
        '🇩🇪 Ich liebe dich Mensure', '🇮🇹 Ti amo Mensure', '🇵🇹 Eu te amo Mensure', '🇷🇺 Я тебя люблю Mensure',
        '🇰🇷 사랑해 Mensure', '🇯🇵 愛してる Mensure', '🇨🇳 我爱你 Mensure', '🇮🇳 मुझे तुमसे प्यार है Mensure',
        "🇬🇷 Σ' αγαπώ Mensure", '🇳🇱 Ik hou van jou Mensure', '🇸🇪 Jag älskar dig Mensure', '🇵🇱 Kocham cię Mensure',
        '🇹🇭 ฉันรักเธอ Mensure', '🇻🇳 Anh yêu em Mensure', '🇮🇩 Aku cinta kamu Mensure', '🇺🇦 Я тебе кохаю Mensure'
      ];
      const COLORS = {
        background: '#13030c',
        wine: [148, 0, 23],
        crimson: [230, 13, 36],
        blood: [250, 25, 41],
        flash: [255, 199, 199]
      };
      const DURATION = 1500;
      const APPEAR_DURATION = 672;
      const LIFT = 34;
      const GAP = 5;
      const FONT = '"Segoe UI", "Aptos", Arial, sans-serif';
      const SIZES = [10, 11, 12];
      const MESSAGE_INTERVAL = 1000;

      let width = 0;
      let height = 0;
      let entries = [];
      let startAt = null;
      let finishedAt = null;
      let frameId = null;
      let ready = false;
      let messageIndex = 0;
      let messageTimer = null;
      let started = false;

      function showNextMessage() {
        const phrase = LOVE_MESSAGES[messageIndex].replace(/,? Mensure$/, '');
        const phraseElement = document.createElement('span');
        phraseElement.className = 'love-phrase';
        phraseElement.textContent = phrase;
        const nameElement = document.createElement('strong');
        nameElement.className = 'love-name';
        nameElement.textContent = 'Mensure';
        loveMessage.replaceChildren(phraseElement, nameElement);
        messageIndex = (messageIndex + 1) % LOVE_MESSAGES.length;
        if (reducedMotion.matches) return;
        loveMessage.classList.remove('show');
        void loveMessage.offsetWidth;
        loveMessage.classList.add('show');
      }

      function resetMessageCycle() {
        window.clearInterval(messageTimer);
        messageIndex = 0;
        showNextMessage();
        messageTimer = window.setInterval(showNextMessage, MESSAGE_INTERVAL);
      }

      // The same implicit heart curve used by the Python/turtle version.
      function heartPoint(angle, scale) {
        return {
          x: 16 * Math.sin(angle) ** 3 * scale,
          y: (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale
        };
      }

      function clamp(value, min = 0, max = 1) {
        return Math.max(min, Math.min(max, value));
      }

      function easeOutCubic(value) {
        return 1 - (1 - value) ** 3;
      }

      function mix(a, b, amount) {
        return a.map((value, index) => value + (b[index] - value) * amount);
      }

      function tint(color, amount) {
        return `rgb(${color.map(value => Math.round(clamp(value, 0, 255))).join(' ')})`;
      }

      function randomFactory(seed) {
        let value = seed >>> 0;
        return () => {
          value += 0x6D2B79F5;
          let n = value;
          n = Math.imul(n ^ (n >>> 15), n | 1);
          n ^= n + Math.imul(n ^ (n >>> 7), n | 61);
          return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
        };
      }

      function shuffled(items, random) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function horizontalSpans(y, scale) {
        const intersections = [];
        const samples = 720;
        let previous = heartPoint(0, scale);
        for (let index = 1; index <= samples; index += 1) {
          const current = heartPoint((Math.PI * 2 * index) / samples, scale);
          const crosses = (previous.y <= y && y < current.y) || (current.y <= y && y < previous.y);
          if (crosses) {
            intersections.push(previous.x + ((y - previous.y) * (current.x - previous.x)) / (current.y - previous.y));
          }
          previous = current;
        }
        intersections.sort((a, b) => a - b);
        const spans = [];
        for (let index = 0; index < intersections.length; index += 2) {
          if (intersections[index + 1] !== undefined) spans.push([intersections[index], intersections[index + 1]]);
        }
        return spans;
      }

      function buildEntries() {
        const random = randomFactory(11);
        const scale = Math.min(width / 38, height / 40);
        const outline = Array.from({ length: 720 }, (_, index) => heartPoint((Math.PI * 2 * index) / 720, scale));
        const yTop = Math.max(...outline.map(point => point.y));
        const yBottom = Math.min(...outline.map(point => point.y));
        const rowHeight = Math.max(...SIZES) + 5;
        const cycle = [];
        let phraseIndex = 0;
        const nextPhrase = () => {
          if (phraseIndex === cycle.length) {
            cycle.push(...shuffled(PHRASES, random));
            phraseIndex = 0;
          }
          return cycle[phraseIndex++];
        };
        const placed = [];

        context.textAlign = 'center';
        context.textBaseline = 'middle';
        for (let y = yTop - rowHeight / 2; y > yBottom + rowHeight / 2; y -= rowHeight) {
          const upperSpans = horizontalSpans(y + rowHeight / 2, scale);
          const lowerSpans = horizontalSpans(y - rowHeight / 2, scale);
          const spans = upperSpans
            .map(([left, right], index) => {
              const lower = lowerSpans[index];
              return lower ? [Math.max(left, lower[0]), Math.min(right, lower[1])] : null;
            })
            .filter(span => span && span[1] - span[0] > 18);

          for (const [leftBound, rightBound] of spans) {
            const left = leftBound + 4;
            const right = rightBound - 4;
            let cursor = left + random() * 8;
            const row = [];
            while (cursor < right) {
              let fitted = null;
              for (let trial = 0; trial < 10; trial += 1) {
                const text = nextPhrase();
                const size = SIZES[Math.floor(random() * SIZES.length)];
                context.font = `700 ${size}px ${FONT}`;
                const textWidth = context.measureText(text).width;
                if (cursor + textWidth <= right) {
                  fitted = { text, size, width: textWidth };
                  break;
                }
              }
              if (!fitted) break;
              row.push({ x: cursor + fitted.width / 2, y, ...fitted });
              cursor += fitted.width + GAP;
            }

            if (row.length === 1) {
              row[0].x = (left + right) / 2;
            } else if (row.length > 1) {
              const usedRight = row[row.length - 1].x + row[row.length - 1].width / 2;
              const freeSpace = right - usedRight;
              row.forEach((item, index) => { item.x += (freeSpace * index) / (row.length - 1); });
            }

            row.forEach((item, index) => {
              const edge = index === 0 || index === row.length - 1;
              const radial = Math.min(1, Math.hypot(item.x / (16 * scale), item.y / (14.5 * scale)));
              let color = mix(COLORS.wine, COLORS.crimson, .25 + .75 * radial);
              color = mix(color, COLORS.blood, random() * .35 + (edge ? .3 : 0));
              placed.push({
                ...item,
                edge,
                color: color.map(value => Math.min(255, value)),
                drift: random() * 20 - 10,
                delay: 0
              });
            });
          }
        }

        // Use the populated left half as the layout source, then reflect it. The curve is
        // perfectly symmetric, so this keeps both lobes equally full at every viewport size.
        const middle = placed.filter(item => Math.abs(item.x) < 6);
        const left = placed.filter(item => item.x <= -6);
        const mirroredRight = left.map(item => ({
          ...item,
          x: -item.x,
          drift: -item.drift,
          color: mix(item.color, COLORS.blood, .06).map(value => Math.min(255, value))
        }));
        const balanced = [...left, ...middle, ...mirroredRight];

        // Start beside the central message, then grow outwards until the entire heart is full.
        balanced.sort((a, b) => Math.hypot(a.x, a.y) - Math.hypot(b.x, b.y));
        balanced.forEach((item, index) => { item.delay = (index / Math.max(1, balanced.length)) * DURATION; });
        return balanced;
      }

      function resize() {
        const box = canvas.getBoundingClientRect();
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(1, Math.floor(box.width));
        height = Math.max(1, Math.floor(box.height));
        canvas.width = Math.floor(width * pixelRatio);
        canvas.height = Math.floor(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        entries = buildEntries();
        ready = true;
        startAt = performance.now();
        finishedAt = null;
        artwork.classList.remove('complete');
      }

      function drawEntry(entry, now) {
        const progress = clamp((now - startAt - entry.delay) / APPEAR_DURATION);
        if (progress <= 0) return;
        const easing = easeOutCubic(progress);
        const flash = .75 * Math.sin(Math.PI * clamp((progress - .55) / .45));
        const x = width / 2 + entry.x + entry.drift * (1 - easing);
        const y = height / 2 - entry.y - (1 - easing) * LIFT;
        const mainColor = mix(mix([6, 2, 8], entry.color, easing ** 1.5), COLORS.flash, flash);

        // A single, centred shadow keeps the small phrases crisp instead of creating a doubled offset.
        context.save();
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.font = `700 ${entry.size}px ${FONT}`;
        context.shadowColor = `rgba(24, 0, 9, ${.7 * easing})`;
        context.shadowBlur = 2;
        context.shadowOffsetX = 0;
        context.shadowOffsetY = 1;
        context.fillStyle = tint(mainColor);
        context.fillText(entry.text, x, y);
        context.restore();
      }

      function drawHeartBase(now) {
        const completion = clamp((now - startAt) / DURATION);
        const scale = Math.min(width / 38, height / 40);
        const expansion = .12 + .88 * easeOutCubic(completion);

        context.save();
        context.translate(width / 2, height / 2);
        context.scale(expansion, expansion);
        context.beginPath();
        for (let index = 0; index <= 720; index += 1) {
          const point = heartPoint((Math.PI * 2 * index) / 720, scale);
          if (index === 0) context.moveTo(point.x, -point.y);
          else context.lineTo(point.x, -point.y);
        }
        context.closePath();
        context.shadowColor = 'rgba(245, 51, 104, .34)';
        context.shadowBlur = 28;
        context.fillStyle = `rgba(103, 5, 36, ${.16 + completion * .2})`;
        context.fill();
        context.restore();
      }

      function draw(now) {
        context.clearRect(0, 0, width, height);
        const bloom = context.createRadialGradient(width / 2, height / 2, 5, width / 2, height / 2, Math.min(width, height) * .54);
        bloom.addColorStop(0, 'rgba(177, 22, 67, .3)');
        bloom.addColorStop(.45, 'rgba(104, 8, 37, .14)');
        bloom.addColorStop(1, 'rgba(6, 2, 8, 0)');
        context.fillStyle = bloom;
        context.fillRect(0, 0, width, height);

        // Delicate moving pinpoints make the background feel softer without competing with the heart.
        context.font = `${Math.max(9, width * .015)}px Georgia, serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        for (let index = 0; index < 14; index += 1) {
          const phase = (now / 2400 + index * 1.73) % 1;
          const x = ((index * 137.5) % width) + Math.sin(now / 1900 + index) * 12;
          const y = ((index * 83.7) % height) - phase * 28;
          context.fillStyle = `rgba(255, 180, 203, ${.07 + .08 * Math.sin(now / 900 + index) ** 2})`;
          context.fillText(index % 3 === 0 ? '♡' : '·', x, y);
        }

        drawHeartBase(now);
        entries.forEach(entry => drawEntry(entry, now));

        if (now >= startAt + DURATION + APPEAR_DURATION) {
          if (!finishedAt) {
            finishedAt = now;
            artwork.classList.add('complete');
          }
          // A quiet, randomly changing glint after the heart has finished arriving.
          const glint = entries[Math.floor((now - finishedAt) / 260) % entries.length];
          if (glint) {
            const x = width / 2 + glint.x;
            const y = height / 2 - glint.y;
            context.font = `700 ${glint.size}px ${FONT}`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillStyle = 'rgb(255 199 199)';
            context.fillText(glint.text, x, y);
          }
        }

        frameId = requestAnimationFrame(draw);
      }

      function restart() {
        cancelAnimationFrame(frameId);
        resize();
        resetMessageCycle();
        if (reducedMotion.matches) startAt -= DURATION + APPEAR_DURATION;
        frameId = requestAnimationFrame(draw);
      }

      function beginExperience() {
        started = true;
        artwork.classList.add('started');
        startHeartButton.hidden = true;
        restart();
      }

      startHeartButton.addEventListener('click', () => {
        startHeartButton.disabled = true;
        startHeartButton.classList.add('leaving');
        if (reducedMotion.matches) beginExperience();
      });
      startHeartButton.addEventListener('animationend', event => {
        if (event.animationName === 'start-disappear') beginExperience();
      });
      restartButton.addEventListener('click', restart);
      window.addEventListener('resize', () => {
        clearTimeout(window.resizeHeartTimer);
        window.resizeHeartTimer = setTimeout(() => {
          if (started) restart();
        }, 120);
      });
      reducedMotion.addEventListener?.('change', () => {
        if (started) restart();
      });
    })();
  </script>
</body>
</html>
